# Standard Dependabot config (dependabot-std).
# Weekly, grouped, 7-day cooldown (time to catch a malicious release).
# Framework majors are ignored so no branch ever gets a cross-major bump: master = CakePHP 3.
# Explicit `versions` ranges, not `update-types`: without a composer.lock Dependabot skips update-types.

version: 2

updates:

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions-deps:
        patterns:
          - '*'

  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: cakephp/*
        versions:
          - '>=4.0'
    groups:
      composer-deps:
        patterns:
          - '*'
