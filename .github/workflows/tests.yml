name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    name: PHP 7.4 - CakePHP 3

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '7.4'
          extensions: intl, mbstring, pdo_sqlite
          coverage: none

      # CakePHP 3 is end-of-life and every release has security advisories; Composer blocks those by
      # default. Allowed here, on the runner only, so the smoke suite can install it.
      - name: Install dependencies
        run: |
          composer config policy.advisories.block false
          composer update --prefer-dist --no-interaction --no-progress

      - name: Run smoke tests
        run: vendor/bin/phpunit --no-configuration --bootstrap vendor/autoload.php tests/SmokeTest.php
